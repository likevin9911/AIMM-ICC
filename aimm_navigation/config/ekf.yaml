ekf_filter_node:
  ros__parameters:
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    use_control: false
    frequency: 30.0
    two_d_mode: true

    # Sensor input flags (example)
    imu0: /mavros/imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 5
    imu0_remove_gravitational_acceleration: true

    odom0: /dummy_odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10